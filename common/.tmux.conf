# =============================================================================
# ~/.tmux.conf
# Tested on: tmux 3.7b+, Debian 12, Ubuntu 22.04/24.04, macOS
# =============================================================================

# ============================================================================
# General
# ============================================================================

# Prefix: C-a instead of C-b (vim-friendly)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster key repetition
set -s escape-time 0

# Increase history
set -g history-limit 100000

# Renumber windows when one is closed
set -g renumber-windows on

# Window titles
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I #W'

# ============================================================================
# Mouse
# ============================================================================

set -g mouse off

# ============================================================================
# Key Bindings
# ============================================================================

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Splits (intuitive)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================================
# Activity Monitoring
# ============================================================================

setw -g monitor-activity on
set -g visual-activity off        # no annoying flash, just highlight

# ============================================================================
# Colors & Terminal
# ============================================================================

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
setw -g aggressive-resize on

# ============================================================================
# Status Bar
# ============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-justify centre

# Colors
set -g status-bg colour235
set -g status-fg colour250

# Left: host + session
set -g status-left-length 40
set -g status-left '#[fg=colour39,bold] #H#[fg=colour245] | #[fg=colour255]#S #[default]'

# Right: uptime + date/time
set -g status-right-length 60
set -g status-right '#[fg=colour245]load: #(uptime | rev | cut -d":" -f1 | rev | sed "s/^ //") #[fg=colour245]| #[fg=colour220]%Y-%m-%d %H:%M#[default] '
#set -g status-right '#[fg=colour245]#(uptime | cut -d"," -f2- | sed "s/^ //") #[fg=colour245]| #[fg=colour220]%Y-%m-%d %H:%M#[default] '
#set -g status-right '#[fg=colour245]up #(uptime | cut -d'\'','\'' -f 2- | sed '\''s/^ //'\'' | cut -d'\'','\'' -f1) #[fg=colour245]| #[fg=colour220]%Y-%m-%d %H:%M#[default] '

# Window list
setw -g window-status-format         '#[fg=colour245] #I:#W '
setw -g window-status-current-format '#[fg=colour255,bg=colour238,bold] #I:#W #[default]'
setw -g window-status-activity-style 'fg=colour208'

# Pane borders
set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour39'

# Message bar
set -g message-style 'fg=colour255,bg=colour235,bold'
