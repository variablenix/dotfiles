# =============================================================================
# ~/.tmux.conf
# Tested on: tmux 3.3+, Debian 12, Ubuntu 22.04/24.04, macOS
# =============================================================================

# =============================================================================
# Prefix
# =============================================================================

# use Ctrl-a instead of Ctrl-b (vim / screen-friendly)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix      # send Ctrl-a to nested tmux or shell

# =============================================================================
# General
# =============================================================================

# start window and pane numbering at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# reduce escape-time (critical for vim inside tmux)
set -s escape-time 0

# increase scrollback history
set -g history-limit 100000

# window titles
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I #W'

# focus events (for vim autoread and gitgutter)
set -g focus-events on

# =============================================================================
# Mouse
# =============================================================================

set -g mouse on

# =============================================================================
# Key Bindings
# =============================================================================

# reload config without restarting
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"

# splits that open in current pane path (intuitive keys)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# new window in current path
bind-key c new-window -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# swap windows left/right
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

# kill pane/window without confirmation prompt
bind-key x kill-pane
bind-key X kill-window

# quick session switching
bind-key S choose-session

# =============================================================================
# Copy Mode (vi-style)
# =============================================================================

setw -g mode-keys vi

bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind ] paste-buffer

# =============================================================================
# Activity Monitoring
# =============================================================================

setw -g monitor-activity on
set -g visual-activity off      # highlight in status bar, no flash/bell

# =============================================================================
# Colors & Terminal
# =============================================================================

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color support
setw -g aggressive-resize on

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-justify centre

# colors
set -g status-bg colour235
set -g status-fg colour250

# left: hostname + session name
set -g status-left-length 40
set -g status-left '#[fg=colour39,bold] #H#[fg=colour245] | #[fg=colour255]#S #[default]'

# right: load average + date/time
set -g status-right-length 60
set -g status-right '#[fg=colour245]load: #(uptime | rev | cut -d":" -f1 | rev | sed "s/^ //") #[fg=colour245]| #[fg=colour220]%Y-%m-%d %H:%M#[default] '

# window list
setw -g window-status-format         '#[fg=colour245] #I:#W '
setw -g window-status-current-format '#[fg=colour255,bg=colour238,bold] #I:#W #[default]'
setw -g window-status-activity-style 'fg=colour208'

# pane borders
set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour39'

# message / command bar
set -g message-style 'fg=colour255,bg=colour235,bold'

# =============================================================================
# Notes
# =============================================================================
#
# Install tmux plugin manager (optional):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Useful plugins (add to end of file if using tpm):
#   set -g @plugin 'tmux-plugins/tpm'
#   set -g @plugin 'tmux-plugins/tmux-sensible'
#   set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
#   set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessions
#   run '~/.tmux/plugins/tpm/tpm'
#
# Key reference:
#   prefix + |    split vertical
#   prefix + -    split horizontal
#   prefix + hjkl navigate panes
#   prefix + HJKL resize panes
#   prefix + r    reload config
#   prefix + S    choose session
#   prefix + [    enter copy mode (vi keys)
#   prefix + </>  swap window left/right
